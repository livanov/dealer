name: Probe (dev)

# Manual helper for developing scrapers: prints what store pages contain.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to fetch
        required: false
        default: ''
      script:
        description: Or run this dev script instead (e.g. scripts/dev/metro-survey.mjs)
        required: false
        default: scripts/probe.mjs
      max:
        description: Characters of non-HTML responses to print
        required: false
        default: '1500'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
          PROBE_MAX: ${{ inputs.max }}
          SCRIPT: ${{ inputs.script }}
        run: node "$SCRIPT" $URLS

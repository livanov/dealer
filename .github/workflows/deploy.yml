name: Build data & deploy

on:
  push:
    branches: [main, 'claude/**']
  schedule:
    # Fresh offers a few times a day (UTC). Scheduled runs use the default branch.
    - cron: '15 7,13,19 * * *'
  workflow_dispatch:

permissions:
  # write: the price history is committed to the `data` branch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Price history lives on the `data` branch (data only, no code). Check it
      # out into ./history; the very first run starts it as an empty branch.
      # Only ls-remote's exit code 2 means there's no branch yet; other errors
      # are retried, then the build goes on without history.
      - name: Get price history
        id: history
        continue-on-error: true
        run: |
          for delay in 0 10 30; do
            sleep $delay
            code=0; git ls-remote --exit-code origin refs/heads/data || code=$?
            if [ $code = 0 ] && git fetch --depth=1 origin data; then
              git worktree add --detach history FETCH_HEAD; exit
            elif [ $code = 2 ]; then
              git worktree add --orphan -b data history; exit
            fi
          done
          exit 1
      - name: Collect offers
        run: npm run data
      # Only main records history; other branches just read it.
      - name: Save price history
        if: github.ref == 'refs/heads/main' && steps.history.outcome == 'success'
        continue-on-error: true
        working-directory: history
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No new prices"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Prices $(date -u +'%F %H:%M')"
          git push origin HEAD:data
      - run: npm run build
      # Other branches only build and test; GitHub Pages deploys from main.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
